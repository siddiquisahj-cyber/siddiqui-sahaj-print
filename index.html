<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIDDIQUI SAHAJ - प्रिंट सेवा</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 font-sans max-w-md mx-auto min-h-screen flex flex-col justify-center">
    <div class="bg-white p-6 rounded-2xl shadow-xl border border-gray-200">
        <!-- दुकान का नाम -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-blue-700 tracking-wide uppercase">SIDDIQUI SAHAJ</h1>
            <p class="text-xs font-semibold text-gray-500 mt-1">डिजिटल प्रिंट एवं फोटोकॉपी सेवा</p>
        </div>

        <!-- अपलोड फॉर्म -->
        <div id="uploadSection" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">आपका नाम</label>
                <input type="text" id="custName" placeholder="अपना नाम दर्ज करें" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">मोबाइल नंबर (वैकल्पिक)</label>
                <input type="tel" id="custPhone" placeholder="मोबाइल नंबर" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">डॉक्यूमेंट चुनें (PDF / इमेज)</label>
                <input type="file" id="docFile" accept=".pdf,image/*" class="w-full p-2 border border-dashed rounded-lg bg-gray-50 text-sm">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">प्रिंट टाइप</label>
                    <select id="printType" class="w-full p-2.5 border rounded-lg text-sm bg-white">
                        <option value="bw_single">B&W (₹2/पेज)</option>
                        <option value="color">Color (₹10/पेज)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">कॉपियां</label>
                    <input type="number" id="copies" value="1" min="1" class="w-full p-2.5 border rounded-lg text-sm">
                </div>
            </div>

            <button onclick="calculateBill()" id="btnCalculate" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition">
                पेज गिनें और बिल देखें
            </button>
        </div>

        <!-- बिल व पेमेंट -->
        <div id="billSection" class="hidden mt-6 pt-4 border-t space-y-4">
            <div class="bg-blue-50 p-4 rounded-xl space-y-2 text-sm border border-blue-100">
                <div class="flex justify-between text-gray-600"><span>फाइल का नाम:</span><span id="billFileName" class="font-medium truncate max-w-[150px]">-</span></div>
                <div class="flex justify-between text-gray-600"><span>कुल पेज:</span><span id="billPages" class="font-bold text-gray-900">0</span></div>
                <div class="flex justify-between text-gray-600"><span>कुल कॉपियां:</span><span id="billCopies" class="font-bold text-gray-900">1</span></div>
                <div class="flex justify-between text-lg font-black text-blue-900 border-t border-blue-200 pt-2 mt-2">
                    <span>कुल राशि:</span>
                    <span>₹<span id="billAmount">0</span></span>
                </div>
            </div>

            <button onclick="payAndSubmit()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow-md transition">
                ₹<span id="btnPayAmount">0</span> का ऑनलाइन भुगतान करें
            </button>
        </div>

        <!-- टोकन रसीद -->
        <div id="successSection" class="hidden text-center py-4 space-y-3">
            <div class="w-14 h-14 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">✓</div>
            <h2 class="text-xl font-bold text-gray-800">भुगतान सफल रहा!</h2>
            <p class="text-xs text-gray-500">आपकी फाइल <b>SIDDIQUI SAHAJ</b> काउंटर पर भेज दी गई है।</p>
            
            <div class="bg-yellow-50 border-2 border-yellow-400 rounded-xl p-4 my-3">
                <p class="text-xs font-bold text-gray-500 uppercase tracking-widest">आपका टोकन नंबर</p>
                <p id="tokenDisplay" class="text-5xl font-black text-gray-900 mt-1">#101</p>
            </div>
            <p class="text-xs text-gray-600">कृपया काउंटर पर यह टोकन नंबर दिखाकर अपना प्रिंट लें।</p>
        </div>
    </div>

    <script>
        var calculatedData = null;

        function calculateBill() {
            var fileInput = document.getElementById("docFile");
            if (!fileInput.files || fileInput.files.length === 0) {
                alert("कृपया एक फाइल (PDF या फोटो) चुनें!");
                return;
            }

            var formData = new FormData();
            formData.append("document", fileInput.files[0]);
            formData.append("printType", document.getElementById("printType").value);
            formData.append("copies", document.getElementById("copies").value);

            var btn = document.getElementById("btnCalculate");
            btn.innerText = "पेज गिने जा रहे हैं...";
            btn.disabled = true;

            fetch("/api/upload-and-calculate", { method: "POST", body: formData })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    btn.innerText = "पेज गिनें और बिल देखें";
                    btn.disabled = false;
                    calculatedData = data;

                    if (data.success) {
                        document.getElementById("billFileName").innerText = data.originalName;
                        document.getElementById("billPages").innerText = data.totalPages;
                        document.getElementById("billCopies").innerText = data.copies;
                        document.getElementById("billAmount").innerText = data.totalAmount;
                        document.getElementById("btnPayAmount").innerText = data.totalAmount;
                        document.getElementById("billSection").classList.remove("hidden");
                    } else {
                        alert("त्रुटि: " + (data.error || "पेज गिनने में समस्या आई"));
                    }
                })
                .catch(function(err) {
                    btn.innerText = "पेज गिनें और बिल देखें";
                    btn.disabled = false;
                    alert("सर्वर से संपर्क नहीं हो पाया!");
                });
        }

        function payAndSubmit() {
            if (!calculatedData) return;
            var confirmPay = confirm("SIDDIQUI SAHAJ को ₹" + calculatedData.totalAmount + " का भुगतान पूरा करें?");
            if (!confirmPay) return;

            var payload = {
                fileId: calculatedData.fileId,
                originalName: calculatedData.originalName,
                totalPages: calculatedData.totalPages,
                printType: calculatedData.printType,
                copies: calculatedData.copies,
                totalAmount: calculatedData.totalAmount,
                customerName: document.getElementById("custName").value || "ग्राहक",
                customerPhone: document.getElementById("custPhone").value || ""
            };

            fetch("/api/confirm-order", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(function(res) { return res.json(); })
            .then(function(result) {
                if (result.success) {
                    document.getElementById("uploadSection").classList.add("hidden");
                    document.getElementById("billSection").classList.add("hidden");
                    document.getElementById("tokenDisplay").innerText = "#" + result.order.tokenNo;
                    document.getElementById("successSection").classList.remove("hidden");
                }
            })
            .catch(function(err) {
                alert("ऑर्डर सबमिट करने में समस्या आई!");
            });
        }
    </script>
</body>
</html>
