<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>SIDDIQUI SAHAJ - काउंटर डैशबोर्ड</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-6 font-sans min-h-screen">
    <div class="max-w-6xl mx-auto">
        <!-- हेडर -->
        <header class="flex justify-between items-center border-b border-slate-800 pb-4 mb-6">
            <div>
                <h1 class="text-3xl font-black text-blue-400 tracking-wider">SIDDIQUI SAHAJ</h1>
                <p class="text-xs text-slate-400 mt-0.5">लाइव प्रिंट एवं काउंटर डैशबोर्ड</p>
            </div>
            <div class="flex items-center space-x-2 bg-slate-900 border border-slate-700 px-4 py-2 rounded-lg">
                <span class="w-3 h-3 bg-green-500 rounded-full animate-ping"></span>
                <span class="text-xs font-bold text-green-400">सिस्टम एक्टिव है</span>
            </div>
        </header>

        <!-- ऑर्डर्स टेबल -->
        <div class="bg-slate-900 rounded-xl overflow-hidden shadow-2xl border border-slate-800">
            <table class="w-full text-left text-sm">
                <thead class="bg-slate-950 text-slate-400 uppercase text-xs">
                    <tr>
                        <th class="p-4">टोकन</th>
                        <th class="p-4">समय</th>
                        <th class="p-4">ग्राहक नाम</th>
                        <th class="p-4">फाइल का नाम</th>
                        <th class="p-4">प्रिंट डिटेल</th>
                        <th class="p-4">बिल राशि</th>
                        <th class="p-4 text-center">प्रिंट एक्शन</th>
                    </tr>
                </thead>
                <tbody id="ordersList" class="divide-y divide-slate-800">
                    <tr>
                        <td colspan="7" class="p-8 text-center text-slate-500">डेटा लोड हो रहा है...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- बीप ऑडियो -->
    <audio id="beepSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        var lastOrderCount = 0;

        function fetchOrders() {
            fetch("/api/admin/orders")
                .then(function(res) { return res.json(); })
                .then(function(orders) {
                    if (orders.length > lastOrderCount && lastOrderCount !== 0) {
                        var sound = document.getElementById("beepSound");
                        if (sound) { sound.play().catch(function(){}); }
                    }
                    lastOrderCount = orders.length;

                    var tbody = document.getElementById("ordersList");
                    if (!orders || orders.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-slate-500 font-bold">अभी कोई नया प्रिंट ऑर्डर नहीं आया है।</td></tr>';
                        return;
                    }

                    var rows = "";
                    for (var i = 0; i < orders.length; i++) {
                        var o = orders[i];
                        var typeBadge = o.printType === "color" 
                            ? '<span class="px-2 py-0.5 bg-amber-900 text-amber-300 rounded text-xs">Color</span>' 
                            : '<span class="px-2 py-0.5 bg-blue-900 text-blue-300 rounded text-xs">B&W</span>';

                        rows += '<tr class="hover:bg-slate-800 transition">' +
                            '<td class="p-4 font-black text-yellow-400 text-xl">#' + o.tokenNo + '</td>' +
                            '<td class="p-4 text-slate-400 text-xs">' + o.createdAt + '</td>' +
                            '<td class="p-4 font-bold text-white">' + o.customerName + '</td>' +
                            '<td class="p-4 max-w-xs truncate text-slate-300">' + o.originalName + '</td>' +
                            '<td class="p-4">' +
                                '<span class="px-2 py-0.5 bg-slate-800 rounded text-xs mr-1">' + o.totalPages + ' पेज</span>' +
                                typeBadge +
                                '<span class="text-xs text-slate-400 ml-1">x' + o.copies + ' कॉपी</span>' +
                            '</td>' +
                            '<td class="p-4 font-black text-green-400 text-base">₹' + o.totalAmount + '</td>' +
                            '<td class="p-4 text-center">' +
                                '<a href="/api/download/' + o.fileId + '" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg font-bold text-xs inline-block shadow">⬇️ डाउनलोड व प्रिंट</a>' +
                            '</td>' +
                        '</tr>';
                    }
                    tbody.innerHTML = rows;
                })
                .catch(function(err) {
                    console.log("Error loading orders:", err);
                });
        }

        fetchOrders();
        setInterval(fetchOrders, 2000);
    </script>
</body>
</html>
