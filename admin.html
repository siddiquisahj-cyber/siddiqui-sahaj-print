<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>SIDDIQUI SAHAJ - काउंटर डैशबोर्ड</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-4 min-h-screen">
    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center border-b border-slate-700 pb-4 mb-6">
            <div>
                <h1 class="text-3xl font-black text-blue-400 tracking-wider">SIDDIQUI SAHAJ</h1>
                <p class="text-xs text-slate-400 mt-1">लाइव प्रिंट एवं काउंटर डैशबोर्ड</p>
            </div>
            <button onclick="loadOrders()" class="bg-blue-600 px-4 py-2 rounded-lg text-sm font-bold hover:bg-blue-500">रिफ्रेश करें</button>
        </header>

        <div class="bg-slate-800 rounded-xl overflow-hidden shadow-2xl border border-slate-700">
            <table class="w-full text-left text-sm">
                <thead class="bg-slate-700 text-slate-300 uppercase text-xs">
                    <tr>
                        <th class="p-4">टोकन</th>
                        <th class="p-4">नाम</th>
                        <th class="p-4">फाइल</th>
                        <th class="p-4">पेज</th>
                        <th class="p-4">राशि</th>
                        <th class="p-4">एक्शन</th>
                    </tr>
                </thead>
                <tbody id="orderTable">
                    <!-- ऑर्डर्स यहाँ लोड होंगे -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function loadOrders() {
            fetch('/api/admin/orders')
                .then(res => res.json())
                .then(data => {
                    const table = document.getElementById('orderTable');
                    table.innerHTML = '';
                    if (data.length === 0) {
                        table.innerHTML = '<tr><td colspan="6" class="p-10 text-center text-slate-500">कोई ऑर्डर नहीं आया है</td></tr>';
                        return;
                    }
                    data.forEach(order => {
                        table.innerHTML += `
                            <tr class="border-b border-slate-700 hover:bg-slate-750">
                                <td class="p-4 font-bold text-yellow-400">#${order.tokenNo}</td>
                                <td class="p-4">${order.customerName}</td>
                                <td class="p-4 truncate max-w-[150px]">${order.originalName}</td>
                                <td class="p-4">${order.totalPages}</td>
                                <td class="p-4 font-bold text-green-400">₹${order.totalAmount}</td>
                                <td class="p-4">
                                    <a href="/api/download/${order.fileId}" target="_blank" class="bg-green-600 px-3 py-1 rounded text-xs font-bold hover:bg-green-500">डाउनलोड</a>
                                </td>
                            </tr>
                        `;
                    });
                })
                .catch(err => console.error("Error:", err));
        }
        // हर 5 सेकंड में ऑटो-रिफ्रेश
        setInterval(loadOrders, 5000);
        loadOrders();
    </script>
</body>
</html>
